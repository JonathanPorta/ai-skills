name: tests

on:
  push:
    branches: [main]
  pull_request:

# One run per pull request (or ref): a newer commit cancels the run still in
# flight for the same PR, so superseded checks stop spending runner minutes.
concurrency:
  group: tests-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        include:
          - python: "3.10"
            bash: "3.2"
          - python: "3.14"
            bash: system
    # These are Python/Git/Bash tests; Bash 3.2 does not require a macOS VM.
    runs-on: ubuntu-slim
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: ${{ matrix.python }}
      - name: Build pinned Bash 3.2 on Linux
        if: matrix.bash == '3.2'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends bison
          make setup-bash32 BASH32_DIR="$RUNNER_TEMP/bash32"
          echo "$RUNNER_TEMP/bash32/bin" >> "$GITHUB_PATH"
      - name: Report test shell
        run: bash --version
      - name: Run canonical checks
        run: make check

  open-design-contract:
    runs-on: ubuntu-slim
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Check out pinned Open Design contract
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: nexu-io/open-design
          ref: fe1231eed69a2312e56c4e155e06781981fff068
          path: .open-design-contract
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.10"
      - name: Set up Node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: "24"
      - name: Install pinned Open Design runtime dependencies
        working-directory: .open-design-contract
        run: corepack pnpm install --frozen-lockfile --ignore-scripts --filter 'open-design...'
      - name: Build pinned Open Design plugin runtime packages
        working-directory: .open-design-contract
        run: corepack pnpm --filter '@open-design/plugin-runtime...' --workspace-concurrency=1 run build
      - name: Verify production plugin loading, staging, and packaging
        run: make integration-open-design OPEN_DESIGN_REPO="$GITHUB_WORKSPACE/.open-design-contract"
