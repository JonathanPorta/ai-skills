name: tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-14]
        python: ["3.10", "3.14"]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: ${{ matrix.python }}
      - name: Run canonical checks
        run: make check

  open-design-contract:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Check out pinned Open Design contract
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: nexu-io/open-design
          ref: 517f39acde402c1a7af2189167a8d6957a3dac71
          path: .open-design-contract
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.10"
      - name: Set up Node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: "24"
      - name: Install pinned Open Design runtime dependencies
        working-directory: .open-design-contract
        run: corepack pnpm install --frozen-lockfile --ignore-scripts --filter open-design
      - name: Verify production discovery, staging, and packaging
        run: make integration-open-design OPEN_DESIGN_REPO="$GITHUB_WORKSPACE/.open-design-contract"
